
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamado Registrado | Focus Central</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #172b4d;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h4 {
            font-weight: bold;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: #dce3ed;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background-color: #29446f;
            color: white;
        }

        .content {
            padding: 35px;
        }

        .success-card {
            max-width: 650px;
            margin: 70px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .success-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #d1e7dd;
            color: #198754;
            font-size: 36px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 sidebar">
            <h4>Focus Central</h4>

            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'lista_chamados' %}">Chamados</a>
            <a href="{% url 'admin:clientes_cliente_changelist' %}">Clientes</a>
            <a href="{% url 'admin:index' %}">Administração</a>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light w-100 mt-3">
                    Sair
                </button>
            </form>
        </aside>

        <main class="col-md-10 content">

            <div class="card success-card">
                <div class="card-body text-center p-5">

                    <div class="success-icon">
                        ✓
                    </div>

                    <h2 class="mb-3">Chamado registrado!</h2>

                    <p class="text-muted">
                        O chamado foi registrado com sucesso no Focus Central.
                    </p>

                    <div class="bg-light rounded p-3 my-4">
                        <p class="text-muted mb-1">Número do chamado</p>

                        <h3 class="text-primary mb-0">
                            #{{ chamado.id }}
                        </h3>

                        <hr>

                        <p class="mb-1">
                            <strong>Título:</strong> {{ chamado.titulo }}
                        </p>

                        <p class="mb-0">
                            <strong>Status:</strong> {{ chamado.get_status_display }}
                        </p>
                    </div>

                    <a href="{% url 'lista_chamados' %}" class="btn btn-primary px-4">
                        Ver chamados
                    </a>

                    <a href="{% url 'novo_chamado' %}" class="btn btn-outline-secondary px-4">
                        Novo chamado
                    </a>

                </div>
            </div>

        </main>
    </div>
</div>

</body>
</html>
