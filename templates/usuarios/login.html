
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Focus Central | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #172b4d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #172b4d;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c757d;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
        }

        .btn-login {
            background: #2463a6;
            color: white;
            padding: 12px;
            font-weight: bold;
            border: none;
        }

        .btn-login:hover {
            background: #194d85;
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="brand">Focus Central</div>

        <div class="subtitle">
            Acesse sua conta para continuar
        </div>

        {% if form.errors %}
            <div class="alert alert-danger">
                Usuário ou senha inválidos. Verifique seus dados.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Usuário ou e-mail</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Digite seu usuário"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit" class="btn btn-login w-100">
                Entrar
            </button>

        </form>

        <div class="text-center mt-4 text-secondary small">
            Focus Network | Focus Central
        </div>

    </div>

</body>
</html>
