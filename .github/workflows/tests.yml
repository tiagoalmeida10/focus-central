
name: Testes automatizados - Focus Central

on:
  push:
    branches:
      - main
      - review/**
  pull_request:
    branches:
      - main

jobs:
  testes:
    name: Executar testes Django
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: focus_central_test
          POSTGRES_USER: focuscentral_app
          POSTGRES_PASSWORD: focuscentral_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focuscentral_app -d focus_central_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install Django==5.2.19 "psycopg[binary]" python-dotenv coverage

      - name: Configurar variáveis de ambiente
        run: |
          echo "DJANGO_SECRET_KEY=chave-temporaria-para-testes-ci" >> $GITHUB_ENV
          echo "DJANGO_DEBUG=False" >> $GITHUB_ENV
          echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
          echo "DB_NAME=focus_central_test" >> $GITHUB_ENV
          echo "DB_USER=focuscentral_app" >> $GITHUB_ENV
          echo "DB_PASSWORD=focuscentral_ci_password" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV

      - name: Verificar configuração Django
        run: python manage.py check

      - name: Executar testes automatizados
        run: python manage.py test chamados --verbosity=2
